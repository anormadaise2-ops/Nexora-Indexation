<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Téléchargements — Nexora</title>
<style>
body{margin:0;padding:25px;background:#0b1020;color:#edf3ff;font-family:"Segoe UI",Arial,sans-serif}
h1{font-size:23px}p{color:#99abc7;font-size:12px}
button{background:#1b2c46;border:1px solid #354c6d;border-radius:8px;padding:9px 12px;color:white;cursor:pointer}
.item{margin:12px 0;padding:16px;background:#142039;border:1px solid #2b3d58;border-radius:12px}
.name{font-size:12px;font-weight:750;overflow-wrap:anywhere}.meta{font-size:10px;color:#9aacc7;margin-top:6px;overflow-wrap:anywhere}
.bar{height:8px;background:#283750;border-radius:99px;overflow:hidden;margin-top:13px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#3b7cf0,#76c6ff);position:relative;transition:width .2s}
.fill.running{background-size:200% 100%;animation:pulse 1.2s linear infinite}
.fill.complete{background:linear-gradient(90deg,#209b70,#73e0b0)}
@keyframes pulse{to{background-position:-200% 0}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.empty{padding:25px;text-align:center;border:1px dashed #344860;border-radius:12px;color:#91a4bf;font-size:12px}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;gap:14px"><h1>⬇ Téléchargements</h1><button id="folder">Ouvrir le dossier</button></div>
<p>Progression en temps réel, vitesse et accès aux fichiers terminés.</p>
<div id="summary" class="meta">Chargement…</div>
<div id="items"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
function human(n){
 if(!Number.isFinite(n)||n<0)return "0 o";
 if(n<1024)return n+" o";
 const units=["Ko","Mo","Go","To"];let x=n/1024,i=0;
 while(x>=1024&&i<units.length-1){x/=1024;i++;}
 return x.toFixed(1)+" "+units[i];
}
function render(items){
 $("items").replaceChildren();
 $("summary").textContent=items.length+" téléchargement(s)";
 if(!items.length){
  const e=document.createElement("div");e.className="empty";e.textContent="Aucun téléchargement pour le moment."; $("items").appendChild(e);return;
 }
 for(const d of items){
  const box=document.createElement("article");box.className="item";
  const name=document.createElement("div");name.className="name";name.textContent=d.filename||"Fichier";
  const meta=document.createElement("div");meta.className="meta";
  meta.textContent=d.state==="completed"?"Terminé · "+human(d.totalBytes):
    human(d.receivedBytes)+" / "+(d.totalBytes?human(d.totalBytes):"taille inconnue")+
    (d.speed>0?" · "+human(d.speed)+"/s":"");
  const bar=document.createElement("div");bar.className="bar";
  const fill=document.createElement("div");fill.className="fill";
  fill.style.width=(d.state==="completed"?100:(d.percent||0))+"%";
  if(d.state==="completed")fill.classList.add("complete");
  if(d.state==="progressing")fill.classList.add("running");
  bar.appendChild(fill);box.append(name,meta,bar);
  const actions=document.createElement("div");actions.className="actions";
  if(d.state==="completed"){
   const open=document.createElement("button");open.textContent="Ouvrir";
   open.addEventListener("click",async()=>{const r=await window.nexora.openDownloadFile(d.id);if(r&&!r.ok)alert(r.message);});
   actions.appendChild(open);
  }else if(d.state==="progressing"){
   const cancel=document.createElement("button");cancel.textContent="Annuler";
   cancel.addEventListener("click",()=>window.nexora.cancelDownload(d.id));actions.appendChild(cancel);
  }
  box.appendChild(actions);$("items").appendChild(box);
 }
}
$("folder").addEventListener("click",()=>window.nexora.openDownloadsFolder());
window.nexora.onDownloads(render);
window.nexora.getDownloads().then(render).catch(()=>{ $("summary").textContent="Impossible de récupérer les téléchargements."; });
</script>
</body>
</html>
