<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
<title>Nexora Browser</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#25324c;--accent:#6c8cff;--text:#edf2ff;--muted:#93a2c3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI",Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
.tabs{display:flex;align-items:center;gap:5px;padding:9px 10px 0;background:#080d18;min-height:43px;overflow-x:auto}
.tab{border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;padding:9px 12px;background:#10182a;color:var(--muted);min-width:100px;max-width:220px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--panel);color:var(--text)}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab button{background:transparent;border:0;color:inherit;cursor:pointer}
button,select{font:inherit}
.toolbar{display:flex;align-items:center;gap:7px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.icon{background:#1a2540;border:1px solid var(--line);color:var(--text);border-radius:9px;height:38px;min-width:38px;cursor:pointer}
.icon:hover,.tab:hover{border-color:var(--accent)}
.address{flex:1;min-width:100px;height:39px;border-radius:10px;border:1px solid var(--line);background:#080e1b;color:var(--text);padding:0 14px;outline:none}
.address:focus{border-color:var(--accent)}
#searchEngine{height:38px;max-width:150px;background:#080e1b;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:0 8px}
#viewHost{flex:1;position:relative;background:white;min-height:0}
webview{position:absolute;inset:0;width:100%;height:100%;background:white}
webview.hidden{display:none}
#status{padding:5px 12px;background:#080d18;color:var(--muted);font-size:11px}
#settings{display:none;position:fixed;z-index:10;right:15px;top:100px;width:min(400px,90vw);background:#111a2d;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 70px #000b}
#settings h2{margin-top:0}
#settings label{display:block;margin:15px 0 7px;color:var(--muted)}
#settings select,#settings input{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:#080e1b;color:var(--text);padding:8px}
.row{display:flex;gap:9px;margin-top:18px}
.primary{background:var(--accent);color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}
.secondary{background:#202c46;color:white;border:1px solid var(--line);border-radius:8px;padding:10px 15px;cursor:pointer}
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at top,#182950,#090e1a 65%);color:white}
.logo{font-size:50px;font-weight:750;letter-spacing:-2px}
.logo b{color:#7796ff}
.home p{color:#a9b8d8}
.home button{margin-top:14px}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="toolbar">
<button class="icon" id="back" title="Retour">←</button>
<button class="icon" id="forward" title="Avancer">→</button>
<button class="icon" id="reload" title="Actualiser">↻</button>
<button class="icon" id="home" title="Accueil">⌂</button>
<input id="address" class="address" placeholder="Rechercher ou saisir une adresse…" autocomplete="off">
<button class="icon" id="go">➜</button>
<button class="icon" id="newTab" title="Nouvel onglet">＋</button>
<button class="icon" id="settingsBtn" title="Paramètres">⚙</button>
</div>
<div id="viewHost"></div>
<div id="status">Nexora Browser · Prêt</div>

<section id="settings">
<h2>⚙ Paramètres Nexora</h2>
<label for="engine">Moteur de recherche par défaut</label>
<select id="engine">
<option value="google">Google</option>
<option value="brave">Brave Search</option>
<option value="bing">Microsoft Bing</option>
<option value="yahoo">Yahoo</option>
<option value="duckduckgo">DuckDuckGo</option>
<option value="ecosia">Ecosia</option>
<option value="qwant">Qwant</option>
<option value="startpage">Startpage</option>
<option value="scholar">Google Scholar</option>
</select>
<label for="startPage">Page d'accueil</label>
<input id="startPage" placeholder="http://localhost:3080">
<div class="row">
<button class="primary" id="saveSettings">Enregistrer</button>
<button class="secondary" id="closeSettings">Fermer</button>
</div>
<p style="font-size:12px;color:#93a2c3">Les moteurs utilisent leurs pages de recherche publiques. La disponibilité dépend de votre connexion et des services concernés.</p>
</section>

<script>
const $ = id => document.getElementById(id);
const engines = {
 google:q=>'https://www.google.com/search?q='+encodeURIComponent(q),
 brave:q=>'https://search.brave.com/search?q='+encodeURIComponent(q),
 bing:q=>'https://www.bing.com/search?q='+encodeURIComponent(q),
 yahoo:q=>'https://search.yahoo.com/search?p='+encodeURIComponent(q),
 duckduckgo:q=>'https://duckduckgo.com/?q='+encodeURIComponent(q),
 ecosia:q=>'https://www.ecosia.org/search?q='+encodeURIComponent(q),
 qwant:q=>'https://www.qwant.com/?q='+encodeURIComponent(q),
 startpage:q=>'https://www.startpage.com/sp/search?query='+encodeURIComponent(q),
 scholar:q=>'https://scholar.google.com/scholar?q='+encodeURIComponent(q)
};
let engine = localStorage.getItem('nexora-engine') || 'google';
let startPage = localStorage.getItem('nexora-home') || 'http://localhost:3080';
let tabs = [], active = null, count = 0;

function normalise(value){
 value=value.trim();
 if(!value) return startPage;
 if(/^(https?|file):\/\//i.test(value)) return value;
 if(/^(localhost|127\.0\.0\.1)(:\d+)?([/?#].*)?$/i.test(value)) return 'http://'+value;
 if(/^[\w.-]+\.[a-z]{2,}(:\d+)?([/?#].*)?$/i.test(value)) return 'https://'+value;
 return engines[engine](value);
}
function addTab(url=startPage){
 const id=++count;
 const el=document.createElement('webview');
 el.setAttribute('partition','persist:nexora');
 el.setAttribute('allowpopups','false');
 el.src=url;
 el.className='hidden';
 $('viewHost').appendChild(el);
 const tab={id,el,title:'Nouvel onglet',url};
 tabs.push(tab);
 el.addEventListener('page-title-updated',e=>{tab.title=e.title||'Page';drawTabs()});
 el.addEventListener('did-navigate',e=>{tab.url=e.url;if(active===id)updateAddress();});
 el.addEventListener('did-navigate-in-page',e=>{tab.url=e.url;if(active===id)updateAddress();});
 el.addEventListener('did-start-loading',()=>{if(active===id)$('status').textContent='Chargement…'});
 el.addEventListener('did-stop-loading',()=>{if(active===id){updateAddress();$('status').textContent='Nexora Browser · '+(tab.url||'Prêt')}});
 el.addEventListener('did-fail-load',e=>{if(e.errorCode!==-3 && active===id)$('status').textContent='Chargement impossible : '+e.errorDescription});
 activate(id);
 return tab;
}
function drawTabs(){
 $('tabs').innerHTML='';
 tabs.forEach(t=>{
  const b=document.createElement('div');
  b.className='tab'+(t.id===active?' active':'');
  const label=document.createElement('span');label.textContent=t.title||'Onglet';
  const close=document.createElement('button');close.textContent='×';close.title='Fermer';
  close.onclick=e=>{e.stopPropagation();closeTab(t.id)};
  b.onclick=()=>activate(t.id);b.append(label,close);$('tabs').appendChild(b);
 });
}
function activate(id){
 active=id;
 tabs.forEach(t=>t.el.classList.toggle('hidden',t.id!==id));
 const t=tabs.find(x=>x.id===id);
 if(t){$('address').value=t.url||'';$('status').textContent='Nexora Browser · '+(t.url||'Prêt')}
 drawTabs();
}
function updateAddress(){
 const t=tabs.find(x=>x.id===active);if(!t)return;
 $('address').value=t.el.getURL()||t.url||'';
}
function navigate(){
 const t=tabs.find(x=>x.id===active);if(!t)return;
 const url=normalise($('address').value);
 t.url=url;t.el.loadURL(url);
 $('address').blur();
}
function closeTab(id){
 const index=tabs.findIndex(t=>t.id===id);if(index<0)return;
 tabs[index].el.remove();tabs.splice(index,1);
 if(!tabs.length)addTab(startPage);
 else if(active===id)activate(tabs[Math.max(0,index-1)].id);
 drawTabs();
}
$('go').onclick=navigate;
$('address').addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});
$('back').onclick=()=>{const t=tabs.find(x=>x.id===active);if(t&&t.el.canGoBack())t.el.goBack()};
$('forward').onclick=()=>{const t=tabs.find(x=>x.id===active);if(t&&t.el.canGoForward())t.el.goForward()};
$('reload').onclick=()=>{const t=tabs.find(x=>x.id===active);if(t)t.el.reload()};
$('home').onclick=()=>{const t=tabs.find(x=>x.id===active);if(t)t.el.loadURL(startPage)};
$('newTab').onclick=()=>addTab(startPage);
$('settingsBtn').onclick=()=>{
 $('engine').value=engine;$('startPage').value=startPage;
 $('settings').style.display='block';
};
$('closeSettings').onclick=()=>$('settings').style.display='none';
$('saveSettings').onclick=()=>{
 engine=$('engine').value;
 startPage=normaliseHome($('startPage').value);
 localStorage.setItem('nexora-engine',engine);
 localStorage.setItem('nexora-home',startPage);
 $('settings').style.display='none';
 $('status').textContent='Paramètres enregistrés';
};
function normaliseHome(value){
 value=(value||'').trim();
 if(!value)return 'http://localhost:3080';
 if(/^(https?|file):\/\//i.test(value))return value;
 return 'https://'+value;
}
window.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='t'){e.preventDefault();addTab(startPage)}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='l'){e.preventDefault();$('address').focus();$('address').select()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='w'&&tabs.length>1){e.preventDefault();closeTab(active)}
});
addTab(startPage);
</script>
</body>
</html>
